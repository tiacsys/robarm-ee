# zdocs registry of robarm-ee (doc-architecture.md §3).
# It lists this repo's own documents first, then the upstream documents. Upstream documents are
# built locally from their west checkouts (doc_dir), so that links into upstream needs resolve
# in this build (D35). Indirect upstream documents are listed by hand until zdocs #26/#27 land.
# Format: tools/zdocs/doc/manual/reference/registry-schema.rst.
# base_url is only used for links outside the HTML tree (PDFs, iteration 2).
base_url: "https://tiacsys.github.io/robarm-manifest/"

groups:
  - id: g-ee
    title: "Electrical"
  - id: g-sys
    title: "System"

documents:
  # own documents: the V-model documents in docs/<id>/, one harnesses document for every cable,
  # per-deliverable documents in a sub-folder (docs/pcbas/; tiacsys/xdmod#69 Q8, CK-A7)
  ee-req:
    title: "EE Requirements Specification"
    group: g-ee
    version_project: robarm-ee
    builders: [html]
    needs: {source: json}

  ee-design:
    title: "EE Design"
    group: g-ee
    version_project: robarm-ee
    builders: [html]
    needs: {source: json}

  ee-test-spec:
    title: "EE Test Specification"
    group: g-ee
    version_project: robarm-ee
    builders: [html]
    needs: {source: json}

  ee-test-report:
    title: "EE Test Report"
    group: g-ee
    version_project: robarm-ee
    builders: [html]
    needs: {source: json}

  harnesses:
    title: "Harnesses"
    group: g-ee
    version_project: robarm-ee
    builders: [html]
    needs: {source: json}

  pcba-canary-board:
    title: "Canary Board"
    group: g-ee
    doc_dir: pcbas/pcba-canary-board
    version_project: robarm-ee
    builders: [html]
    needs: {source: json}

  # upstream documents (built locally from the sibling west projects, D35)
  se-req:
    title: "Stakeholder and System Requirements Specification"
    group: g-sys
    doc_dir: ../../robarm-syseng/docs/se-req
    version_project: robarm-syseng
    builders: [html]
    needs: {source: json}
  se-arch:
    title: "System Architecture"
    group: g-sys
    doc_dir: ../../robarm-syseng/docs/se-arch
    version_project: robarm-syseng
    builders: [html]
    needs: {source: json}
